twig:
    file_name_pattern: '*.twig'
    globals:
        stripe_public_key: '%stripe.public_key%'
        google_api_key: '%google.api.key%'
        stripe_dashboard_url: '%stripe.dashboard.url%'

    paths:
        '%kernel.project_dir%/public/images/email': images

when@test:
    twig:
        strict_variables: true
