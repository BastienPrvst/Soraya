
# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

parameters:
    stripe.public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe.secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe.webhook_secret_key: '%env(STRIPE_WEBHOOK_SECRET)%'
    stripe.dashboard.url: '%env(STRIPE_DASHBOARD_URL)%'
    google.api.key: '%env(GOOGLE_MAP_API_KEY)%'

services:
    # Default configuration for services in this file
    _defaults:
        autowire: true
        autoconfigure: true

    # Automatically register classes in src/ as services
    App\:
        resource: '../src/'

    App\Service\StripePaymentService:
        arguments:
            $stripeSecretKey: '%stripe.secret_key%'

    App\Service\MondialRelayService:
        arguments:
            $mrEnseigne: '%env(MONDIAL_RELAY_ENSEIGNE)%'
            $mrPrivateKey: '%env(MONDIAL_RELAY_PRIVATE_KEY)%'
            $mrBrandCode: '%env(MONDIAL_RELAY_BRAND_CODE)%'
            $mrApiUrl: '%env(MONDIAL_RELAY_API_V2_URL)%'
            $mrApiId: '%env(MONDIAL_RELAY_API_V2_ID)%'
            $mrApiPassword: '%env(MONDIAL_RELAY_API_V2_PASSWORD)%'
            $senderName: '%env(MONDIAL_RELAY_SENDER_NAME)%'
            $senderStreet: '%env(MONDIAL_RELAY_SENDER_STREET)%'
            $senderZipcode: '%env(MONDIAL_RELAY_SENDER_ZIPCODE)%'
            $senderCity: '%env(MONDIAL_RELAY_SENDER_CITY)%'
            $senderCountry: '%env(MONDIAL_RELAY_SENDER_COUNTRY)%'
            $senderPhone: '%env(MONDIAL_RELAY_SENDER_PHONE)%'
            $senderEmail: '%env(MONDIAL_RELAY_SENDER_EMAIL)%'
